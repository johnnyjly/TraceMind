services:
  checkout:
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      GOMEMLIMIT: 48MiB
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      GOMEMLIMIT: 48MiB
  flagd:
    volumes:
      - ${TRACEMIND_FLAGD_CONFIG}:/etc/flagd/demo.flagd.json:ro
  jaeger:
    ports:
      - "16686:16686"
  opensearch:
    ports:
      - "9200:9200"
