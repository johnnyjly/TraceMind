services:
  checkout:
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      GOMEMLIMIT: 48MiB
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      GOMEMLIMIT: 48MiB
  astronomy-db:
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
  flagd:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    volumes:
      - ${TRACEMIND_FLAGD_CONFIG}:/etc/flagd/demo.flagd.json:ro
  jaeger:
    volumes:
      - ${TRACEMIND_JAEGER_CONFIG:?use scripts/demo_scenario.py}:/etc/jaeger/config.yml:ro
      - jaeger-data:/tmp
    ports:
      - "16686:16686"
  opensearch:
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
  grafana:
    deploy:
      resources:
        limits:
          memory: 512M
  prometheus:
    deploy:
      resources:
        limits:
          memory: 512M
  frontend-proxy:
    deploy:
      resources:
        limits:
          memory: 128M
  shipping:
    deploy:
      resources:
        limits:
          memory: 64M
  quote:
    deploy:
      resources:
        limits:
          memory: 64M
  currency:
    deploy:
      resources:
        limits:
          memory: 64M
  valkey-cart:
    deploy:
      resources:
        limits:
          memory: 64M

# External ownership keeps ordinary Demo teardown from deleting trace history.
volumes:
  jaeger-data:
    external: true
    name: tracemind-jaeger-data
