[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracemind"
version = "0.1.0"
description = "An evidence-driven incident diagnosis system for distributed microservices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.126,<1",
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "mcp>=1.26,<2",
    "pydantic-settings>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
rag = [
    "docling==2.137.0",
    "ir-measures>=0.4,<0.5",
    "langchain-classic>=1.0.8,<2",
    "langchain-text-splitters>=1.1.3,<2",
    "lightrag-hku==1.5.7",
    "pypdf>=6.1,<7",
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracemind"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
