[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracemind"
version = "0.1.0"
description = "An evidence-driven incident diagnosis system for distributed microservices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.126,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracemind"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

